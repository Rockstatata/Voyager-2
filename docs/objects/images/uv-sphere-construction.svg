<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#79c0ff"/></marker>
  </defs>
  <rect width="960" height="600" fill="#0d1117"/>
  <text x="40" y="52" fill="#f0f6fc" font-family="Segoe UI, sans-serif" font-size="28" font-weight="700">UV sphere construction</text>
  <text x="40" y="82" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="16">Latitude chooses a ring; longitude chooses a point around that ring.</text>
  <circle cx="280" cy="320" r="180" fill="#13233a" stroke="#79c0ff" stroke-width="3"/>
  <ellipse cx="280" cy="230" rx="156" ry="36" fill="none" stroke="#58a6ff" stroke-width="2"/>
  <ellipse cx="280" cy="275" rx="174" ry="24" fill="none" stroke="#58a6ff" stroke-width="2"/>
  <ellipse cx="280" cy="320" rx="180" ry="12" fill="none" stroke="#f2cc60" stroke-width="3"/>
  <ellipse cx="280" cy="365" rx="174" ry="24" fill="none" stroke="#58a6ff" stroke-width="2"/>
  <ellipse cx="280" cy="410" rx="156" ry="36" fill="none" stroke="#58a6ff" stroke-width="2"/>
  <ellipse cx="280" cy="320" rx="65" ry="180" fill="none" stroke="#a371f7" stroke-width="2"/>
  <ellipse cx="280" cy="320" rx="120" ry="180" fill="none" stroke="#a371f7" stroke-width="2"/>
  <line x1="280" y1="320" x2="420" y2="225" stroke="#79c0ff" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="420" cy="225" r="6" fill="#ff7b72"/>
  <text x="430" y="218" fill="#ff7b72" font-family="Consolas, monospace" font-size="15">Vertex P</text>
  <text x="232" y="125" fill="#f0f6fc" font-family="Segoe UI, sans-serif" font-size="15">north pole, v = 1</text>
  <text x="222" y="525" fill="#f0f6fc" font-family="Segoe UI, sans-serif" font-size="15">south pole, v = 0</text>
  <text x="468" y="326" fill="#f2cc60" font-family="Segoe UI, sans-serif" font-size="15">equator</text>
  <rect x="535" y="125" width="380" height="400" rx="16" fill="#161b22" stroke="#30363d"/>
  <text x="565" y="170" fill="#f0f6fc" font-family="Segoe UI, sans-serif" font-size="21" font-weight="700">Vertex formula</text>
  <text x="565" y="210" fill="#c9d1d9" font-family="Consolas, monospace" font-size="16">t = latitude / latitudeSegments</text>
  <text x="565" y="240" fill="#c9d1d9" font-family="Consolas, monospace" font-size="16">q = longitude / longitudeSegments</text>
  <text x="565" y="285" fill="#79c0ff" font-family="Consolas, monospace" font-size="16">polar   = πt</text>
  <text x="565" y="315" fill="#a371f7" font-family="Consolas, monospace" font-size="16">azimuth = 2πq</text>
  <text x="565" y="365" fill="#f0f6fc" font-family="Consolas, monospace" font-size="16">x = sin(polar) cos(azimuth)</text>
  <text x="565" y="395" fill="#f0f6fc" font-family="Consolas, monospace" font-size="16">y = cos(polar)</text>
  <text x="565" y="425" fill="#f0f6fc" font-family="Consolas, monospace" font-size="16">z = sin(polar) sin(azimuth)</text>
  <text x="565" y="475" fill="#7ee787" font-family="Consolas, monospace" font-size="16">normal = normalize(position)</text>
  <text x="565" y="505" fill="#7ee787" font-family="Consolas, monospace" font-size="16">texCoord = (1 - q, 1 - t)</text>
</svg>
