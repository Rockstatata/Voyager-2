<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360">
  <defs><marker id="pipelineArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#79c0ff"/></marker></defs>
  <rect width="1100" height="360" fill="#0d1117"/>
  <text x="40" y="50" fill="#f0f6fc" font-family="Segoe UI, sans-serif" font-size="28" font-weight="700">From math to pixels</text>
  <g font-family="Segoe UI, sans-serif">
    <rect x="40" y="100" width="185" height="160" rx="14" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="68" y="137" fill="#58a6ff" font-size="19" font-weight="700">UvSphereGenerator</text>
    <text x="68" y="175" fill="#c9d1d9" font-size="15">2,145 Vertex records</text><text x="68" y="202" fill="#c9d1d9" font-size="15">11,904 indices</text><text x="68" y="229" fill="#c9d1d9" font-size="15">3,968 triangles</text>
    <rect x="285" y="100" width="185" height="160" rx="14" fill="#161b22" stroke="#a371f7" stroke-width="2"/>
    <text x="350" y="137" fill="#a371f7" font-size="19" font-weight="700">Mesh</text>
    <text x="317" y="175" fill="#c9d1d9" font-size="15">VBO: vertex bytes</text><text x="317" y="202" fill="#c9d1d9" font-size="15">EBO: index bytes</text><text x="317" y="229" fill="#c9d1d9" font-size="15">VAO: layout recipe</text>
    <rect x="530" y="100" width="210" height="160" rx="14" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
    <text x="571" y="137" fill="#f0883e" font-size="19" font-weight="700">SceneObject</text>
    <text x="560" y="175" fill="#c9d1d9" font-size="15">shared Mesh</text><text x="560" y="202" fill="#c9d1d9" font-size="15">Material + texture</text><text x="560" y="229" fill="#c9d1d9" font-size="15">double Transform</text>
    <rect x="800" y="100" width="255" height="160" rx="14" fill="#161b22" stroke="#7ee787" stroke-width="2"/>
    <text x="865" y="137" fill="#7ee787" font-size="19" font-weight="700">Renderer + GLSL</text>
    <text x="830" y="175" fill="#c9d1d9" font-size="15">model → view → projection</text><text x="830" y="202" fill="#c9d1d9" font-size="15">sample albedo at (u, v)</text><text x="830" y="229" fill="#c9d1d9" font-size="15">depth test + triangle raster</text>
  </g>
  <g stroke="#79c0ff" stroke-width="3" marker-end="url(#pipelineArrow)"><line x1="225" y1="180" x2="275" y2="180"/><line x1="470" y1="180" x2="520" y2="180"/><line x1="740" y1="180" x2="790" y2="180"/></g>
  <text x="40" y="320" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="16">The generator knows geometry, Mesh knows GPU storage, SceneObject knows identity/state, and Renderer knows drawing.</text>
</svg>
